# Configuration for BGT60TR13C Finger Classification Model

# Data parameters (BGT60TR13C-specific)
data:
  num_classes: 5
  input_shape: [128, 256]  # [num_chirps, num_samples] - BGT60 Range-Doppler format
  labels: ['thumb', 'index', 'middle', 'ring', 'pinky']
  range_resolution_cm: 2.73  # BGT60TR13C with 5.5 GHz bandwidth
  max_range_m: 5.0

# Model architecture
model:
  name: 'RangeDopplerCNN'
  channels: 1  # Single-channel Range-Doppler magnitude
  feature_maps: [32, 64, 128, 256]  # CNN feature progression
  dropout: 0.5  # Increased to prevent overfitting
  use_attention: true  # Attention mechanism for Range-Doppler features

# Training parameters
training:
  batch_size: 64  # Increased for CPU with 62GB RAM
  epochs: 100
  learning_rate: 0.003  # Increased for better convergence
  weight_decay: 0.0001
  optimizer: 'adam'
  scheduler: 'cosine'  # Cosine annealing
  early_stopping_patience: 15
  label_smoothing: 0.1
  
# Data augmentation (for Range-Doppler maps)
augmentation:
  enabled: true            # Re-enable with conservative settings
  noise_std: 0.01          # Very light Gaussian noise
  shift_range: 1           # Allow ±1 bin shift in range/doppler
  intensity_scale: [0.98, 1.02]  # Mild intensity scaling only

# Validation
validation:
  split: 0.2
  metric: 'accuracy'
  
# Hardware - Optimized for Intel i9-14900 (32 cores, 62GB RAM)
device: 'cpu'  # No GPU available
num_workers: 16  # Utilizing multi-core CPU efficiently
pin_memory: false  # Disabled for CPU-only training

# Logging
logging:
  log_interval: 10  # batches
  save_interval: 5  # epochs
  tensorboard: true
  
# Paths
paths:
  data_dir: 'data'
  model_dir: 'models'
  log_dir: 'logs'
  results_dir: 'results'
